name: Container image

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tagged-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set nightly metadata
        id: nightly
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nightly.outputs.image }}:nightly
            ${{ steps.nightly.outputs.image }}:${{ steps.nightly.outputs.tag }}
            ${{ steps.nightly.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.nightly.outputs.tag }}

      - name: Create or update the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          if gh release view "$NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release edit "$NIGHTLY_TAG" --prerelease \
              --title "$NIGHTLY_TAG" \
              --notes "Automated nightly build; not a hardened release."
          else
            gh release create "$NIGHTLY_TAG" --target "$GITHUB_SHA" \
              --prerelease --title "$NIGHTLY_TAG" \
              --notes "Automated nightly build; not a hardened release."
          fi
